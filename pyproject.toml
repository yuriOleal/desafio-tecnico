[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "desafio-tecnico"
version = "1.0.0"
description = "Desafio técnico - Desenvolvedor/a de Sistemas Jr.: comissões, estoque e juros por atraso."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Yuri Henrique Ferreira Leal" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]
build = ["pyinstaller>=6"]

[project.scripts]
desafio = "desafio.cli:main"
desafio-gui = "desafio.gui:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
desafio = ["dados/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
